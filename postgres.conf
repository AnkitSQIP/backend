# IPWatch PostgreSQL 16 — tuned for 8GB VPS, SSD storage
# Applied via: postgres -c config_file=/etc/postgresql/postgresql.conf

# Connections — kept low because PgBouncer handles concurrency
max_connections = 30

# Memory
shared_buffers = 512MB              # ~6% of 8GB RAM
work_mem = 32MB                     # per sort/hash op (30 conns × 32MB = 960MB peak)
maintenance_work_mem = 256MB        # CREATE INDEX, VACUUM, pg_restore
effective_cache_size = 2GB          # planner hint: how much OS cache exists

# WAL / Checkpoints
wal_buffers = 16MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
min_wal_size = 256MB
max_wal_size = 1GB

# Query planner — SSD tuning
random_page_cost = 1.1              # SSD: random ≈ sequential
effective_io_concurrency = 200      # SSD: high parallelism
default_statistics_target = 200     # better cardinality estimates

# Autovacuum — more aggressive to keep indexes fresh
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 2ms

# Logging (errors + slow queries only)
log_min_duration_statement = 1000   # log queries >1s
log_checkpoints = on
log_connections = off
log_disconnections = off

# pgvector
shared_preload_libraries = 'vector'
